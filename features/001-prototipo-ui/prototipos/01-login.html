<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Apontamento de Horas</title>
<style>
  :root{
    --primary:#4f46e5; --primary-hover:#4338ca; --bg:#f1f5f9; --card:#ffffff;
    --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --danger:#dc2626; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff 0%,#f8fafc 45%,#e0e7ff 100%);
    color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    box-shadow:0 18px 45px rgba(15,23,42,.10);
    width:100%;max-width:400px;padding:40px 36px;
  }
  .logo{
    width:56px;height:56px;border-radius:15px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 20px;color:#fff;font-size:24px;font-weight:700;
  }
  .brand{text-align:center;font-size:20px;font-weight:700;margin-bottom:6px}
  .subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
  .field{margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{
    width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.18)}
  .btn{
    width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;
    font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px;
  }
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .forgot{text-align:center;margin-top:18px;font-size:13px}
  .forgot a{color:var(--primary);text-decoration:none;font-weight:600}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
</style>
</head>
<body>
  <main class="login-card" role="main">
    <div class="logo" aria-hidden="true">A</div>
    <h1 class="brand">Apontamento de Horas</h1>
    <p class="subtitle">Acesse sua conta para continuar</p>
    <form novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="voce@empresa.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="forgot"><a href="#">Esqueci minha senha</a></p>
    <p class="hint">Use suas credenciais corporativas</p>
  </main>
</body>
</html>
