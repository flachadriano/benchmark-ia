<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apontamento de horas</title>
<style>
  :root{
    --primary:#4f46e5; --primary-hover:#4338ca; --bg:#f1f5f9; --card:#ffffff;
    --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --danger:#dc2626; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
  }
  header{
    background:var(--card);border-bottom:1px solid var(--border);
    padding:14px 24px;display:flex;align-items:center;gap:16px;
  }
  .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
  .brand .dot{
    width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .spacer{flex:1}
  .user{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
  .avatar{
    width:32px;height:32px;border-radius:50%;background:#c7d2fe;color:#3730a3;
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;
  }
  main{max-width:720px;margin:0 auto;padding:28px 24px}
  .page-title{font-size:22px;font-weight:700}
  .page-sub{color:var(--muted);font-size:14px;margin-top:4px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .field{margin-bottom:18px}
  .field.full{grid-column:1/-1}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input,.select{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  input:focus,.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.18)}
  .total{
    background:#eef2ff;border:1px dashed #c7d2fe;border-radius:8px;padding:11px 12px;
    font-size:16px;font-weight:700;color:#3730a3;letter-spacing:.02em;
  }
  .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:8px}
  .btn{
    padding:11px 22px;border-radius:8px;border:1px solid var(--border);background:#fff;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text);
  }
  .btn:hover{background:#f8fafc}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot">A</span>Apontamento de Horas</div>
    <div class="spacer"></div>
    <div class="user"><span>Olá, Ana</span><span class="avatar">AN</span></div>
  </header>
  <main>
    <h1 class="page-title">Apontamento de horas</h1>
    <p class="page-sub">Registre as horas trabalhadas em um projeto.</p>
    <div class="card">
      <form novalidate>
        <div class="field full">
          <label for="projeto">Projeto</label>
          <input id="projeto" type="text" placeholder="Ex.: Portal do Cliente" value="Portal do Cliente">
        </div>
        <div class="grid">
          <div class="field">
            <label for="data">Data</label>
            <input id="data" type="date" value="2026-10-20">
          </div>
          <div class="field">
            <label for="hinicial">Hora inicial</label>
            <input id="hinicial" type="time" value="09:00">
          </div>
          <div class="field">
            <label for="hfinal">Hora final</label>
            <input id="hfinal" type="time" value="12:30">
          </div>
          <div class="field">
            <label for="total">Total de horas</label>
            <div class="total" id="total">03:30</div>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
